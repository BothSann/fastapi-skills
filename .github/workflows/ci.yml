name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Lint scripts
        shell: bash
        run: |
          scripts="skills/fastapi-learn/scripts/learn.py skills/fastapi-modular-monolith/scripts/boundaries.py"
          uvx ruff@0.17.4 check --select E,F,I,B,UP,ASYNC,BLE,PLC0415,DTZ --line-length 110 --target-version py311 $scripts
          uvx ruff@0.17.4 format --check --line-length 100 --target-version py311 $scripts
          for script in $scripts; do
            uvx mypy@2.4.1 --strict --python-version 3.11 "$script"
          done

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Install benchmark packages
        run: npm ci
        working-directory: scripts

      - name: Check token budgets
        run: node check-tokens.mjs
        working-directory: scripts
